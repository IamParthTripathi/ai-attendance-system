<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — AttendAI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-wrapper">
  <div class="login-card">

    <div class="login-logo">
      <div class="logo-icon-lg">🎓</div>
      <h1>AttendAI</h1>
      <p>AI-powered face attendance system</p>
    </div>

    <div id="alert-box"></div>

    <div class="form-group">
      <label class="form-label" for="email">Email address</label>
      <input type="email" id="email" class="form-control"
             placeholder="admin@school.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input type="password" id="password" class="form-control"
             placeholder="Enter your password" autocomplete="current-password">
    </div>

    <button class="btn btn-primary btn-full btn-lg" id="login-btn"
            style="margin-top:8px" onclick="doLogin()">
      Sign in →
    </button>

    <p style="text-align:center;margin-top:20px;font-size:13px;color:var(--text-muted)">
      Demo: <strong style="color:var(--text)">admin@school.com</strong> /
      <strong style="color:var(--text)">admin123</strong>
    </p>

  </div>
</div>

<script src="js/config.js"></script>
<script>
// Already logged in → skip to dashboard
(function() {
  if (getUser()) window.location.replace('dashboard.html');
})();

async function doLogin() {
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('login-btn');
  clearAlert('alert-box');

  if (!email)    { showAlert('alert-box', 'Please enter your email address.'); return; }
  if (!password) { showAlert('alert-box', 'Please enter your password.');      return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-inline"></span> Signing in…';

  try {
    const res  = await fetch(`${API_BASE}/auth.php`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ email, password }),
    });
    const data = await res.json();

    if (data.success && data.user) {
      setUser(data.user);
      window.location.replace('dashboard.html');
    } else {
      showAlert('alert-box', data.error || 'Login failed. Check your credentials.');
    }
  } catch (e) {
    showAlert('alert-box', 'Connection error. Make sure WAMP/XAMPP is running.');
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'Sign in →';
  }
}

['email','password'].forEach(id =>
  document.getElementById(id).addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  })
);
</script>
</body>
</html>
